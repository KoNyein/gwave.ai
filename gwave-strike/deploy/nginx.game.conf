# game.gwave.cc — static client + Colyseus WebSocket proxy (blueprint §5.2)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 443 ssl http2;
    server_name game.gwave.cc;
    # certbot fills in ssl_certificate lines

    root /var/www/gwave-strike/client-dist;
    index index.html;

    location /colyseus/ {
        proxy_pass http://127.0.0.1:2567/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://127.0.0.1:2567/health;
    }

    location ~* \.(glb|ktx2|wasm)$ {
        types { model/gltf-binary glb; image/ktx2 ktx2; application/wasm wasm; }
        expires 365d; add_header Cache-Control "public, immutable";
    }
    gzip on; gzip_types application/javascript text/css application/wasm;
}
server { listen 80; server_name game.gwave.cc; return 301 https://$host$request_uri; }
