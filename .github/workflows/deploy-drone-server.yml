name: Deploy GWAVE DRONE server

# The drone game server (ws :8787 + REST api :8788) lives on the SAME app EC2
# box as everything else — the `drone` container behind Caddy's `/drone-ws`
# and `handle_path /drone-api/*` routes — mirroring deploy-strike.yml's
# ECR → SSM pipeline. Fires only when gwave-drone-server/ changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gwave-drone-server/**"
      - ".github/workflows/deploy-drone-server.yml"
  pull_request:
    paths:
      - "gwave-drone-server/**"
      - ".github/workflows/deploy-drone-server.yml"

concurrency:
  group: deploy-drone-server-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-1
  ECR_REPO: gwave-drone-server

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gwave-drone-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # no build step (plain ESM) — gate on syntax + a boot smoke in off/memory
      # mode: both processes must come up and /health must answer
      - run: for f in *.js; do node --check "$f"; done
      - name: Boot smoke
        run: |
          set -euo pipefail
          AUTH_MODE=off node start.js &
          PID=$!
          ok=0
          for i in $(seq 1 15); do
            sleep 1
            if curl -fsS http://127.0.0.1:8788/health >/dev/null; then ok=1; break; fi
          done
          kill $PID || true
          [ "$ok" = "1" ] || { echo "::error::api /health never came up"; exit 1; }

  deploy:
    # PRs never deploy — main pushes and manual dispatch only.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure the ECR repository exists
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names "$ECR_REPO" \
            --region "$AWS_REGION" >/dev/null 2>&1 && exit 0
          echo "creating ECR repository $ECR_REPO"
          aws ecr create-repository --repository-name "$ECR_REPO" \
            --image-scanning-configuration scanOnPush=true \
            --region "$AWS_REGION" >/dev/null

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        working-directory: gwave-drone-server
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            -t "$REGISTRY/$ECR_REPO:${{ github.sha }}" \
            -t "$REGISTRY/$ECR_REPO:latest" .
          docker push "$REGISTRY/$ECR_REPO:${{ github.sha }}"
          docker push "$REGISTRY/$ECR_REPO:latest"

      - name: Deploy on EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.APP_INSTANCE_ID }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          [ -n "$INSTANCE_ID" ] || { echo "::error::APP_INSTANCE_ID repo variable is not set"; exit 1; }
          IMAGE="$REGISTRY/$ECR_REPO:${{ github.sha }}"

          # Same rollback shape as the strike deploy: tag the running image
          # before swapping, health-gate the new one, put the old one back on
          # failure. SSM runs as root under dash, so bash comes via heredoc.
          cat > /tmp/drone-deploy.sh <<EOF
          set -euo pipefail
          IMAGE="$IMAGE"

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          docker pull "\$IMAGE"

          if docker inspect drone >/dev/null 2>&1; then
            PREV=\$(docker inspect --format '{{.Config.Image}}' drone)
            docker tag "\$PREV" drone-prev:rollback
          else
            PREV=""
          fi

          start() {
            docker rm -f drone >/dev/null 2>&1 || true
            docker run -d --name drone --restart unless-stopped \
              -p 127.0.0.1:8787:8787 -p 127.0.0.1:8788:8788 \
              --env-file /etc/gwave-web.env \
              "\$1"
          }

          start "\$IMAGE"

          ok=0
          for i in \$(seq 1 20); do
            sleep 3
            if curl -fsS http://127.0.0.1:8788/health >/dev/null; then ok=1; break; fi
          done

          if [ "\$ok" != "1" ]; then
            echo "new image failed health check"
            docker logs --tail 50 drone || true
            if [ -n "\$PREV" ]; then
              echo "rolling back to \$PREV"
              start drone-prev:rollback
            fi
            exit 1
          fi

          curl -fsS http://127.0.0.1:8788/health
          docker image prune -f >/dev/null 2>&1 || true
          EOF

          # ' = jq's escape for a single quote, so the generated heredoc
          # marker is QUOTED ('DRONEEOF') and sh expands nothing inside.
          jq -Rs '{commands: ["bash <<\u0027DRONEEOF\u0027\n" + . + "DRONEEOF\n"]}' \
            /tmp/drone-deploy.sh > /tmp/drone-params.json
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $ECR_REPO:${{ github.sha }}" \
            --parameters file:///tmp/drone-params.json \
            --query 'Command.CommandId' --output text)
          echo "SSM CommandId: $CMD_ID"

          STATUS=InProgress
          for i in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            echo "  still $STATUS (${i}0s)"
          done
          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          echo "SSM status: $STATUS"
          [ "$STATUS" = "Success" ] || { echo "::error::drone server deploy failed (rolled back if a previous image existed)"; exit 1; }

      - name: Health check through the domain
        run: |
          # The container is health-gated above; this checks the Caddy route.
          # Warning (not error) because the FIRST rollout lands before the
          # /drone-api route exists in /etc/caddy/Caddyfile — add it, then
          # this goes green on the next run.
          for i in $(seq 1 10); do
            if curl -fsS "https://gwave.cc/drone-api/health"; then exit 0; fi
            sleep 6
          done
          echo "::warning::gwave.cc/drone-api/health not reachable — are the Caddy /drone-ws + /drone-api routes added on the box? (deploy/gwave-drone/README.md)"
