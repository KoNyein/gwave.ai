name: GWAVE Home platform

# Same ECR → SSM pipeline as metaverse-server.yml / deploy-strike.yml.
# One container `gwave-home`: REST API on 127.0.0.1:4100 (container-internal 4000 — host 4000 belongs to the self-hosted Realtime) (fronted by the
# Next.js /api/home proxy) + MQTT broker on 0.0.0.0:1883 (ESP32 nodes).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "gwave-home/**"
      - ".github/workflows/gwave-home.yml"
  pull_request:
    paths:
      - "gwave-home/**"
      - ".github/workflows/gwave-home.yml"

concurrency:
  group: gwave-home-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-1
  ECR_REPO: gwave-home

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: gwave-home
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # End-to-end engine smoke: broker → auto-discovery → ingest → rule
      # fire → device command. No Postgres or hardware needed (mocked).
      - run: npm test

  deploy:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure the ECR repository exists
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names "$ECR_REPO" \
            --region "$AWS_REGION" >/dev/null 2>&1 && exit 0
          echo "creating ECR repository $ECR_REPO"
          aws ecr create-repository --repository-name "$ECR_REPO" \
            --image-scanning-configuration scanOnPush=true \
            --region "$AWS_REGION" >/dev/null

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        working-directory: gwave-home
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            -t "$REGISTRY/$ECR_REPO:${{ github.sha }}" \
            -t "$REGISTRY/$ECR_REPO:latest" .
          docker push "$REGISTRY/$ECR_REPO:${{ github.sha }}"
          docker push "$REGISTRY/$ECR_REPO:latest"

      - name: Deploy on EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.APP_INSTANCE_ID }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          [ -n "$INSTANCE_ID" ] || { echo "::error::APP_INSTANCE_ID repo variable is not set"; exit 1; }
          IMAGE="$REGISTRY/$ECR_REPO:${{ github.sha }}"

          cat > /tmp/gh-deploy.sh <<EOF
          set -euo pipefail
          IMAGE="$IMAGE"

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$REGISTRY"
          docker pull "\$IMAGE"

          if docker inspect gwave-home >/dev/null 2>&1; then
            PREV=\$(docker inspect --format '{{.Config.Image}}' gwave-home)
            docker tag "\$PREV" gwave-home-prev:rollback
          else
            PREV=""
          fi

          start() {
            docker rm -f gwave-home >/dev/null 2>&1 || true
            docker run -d --name gwave-home --restart unless-stopped \
              -p 127.0.0.1:4100:4000 -p 1883:1883 \
              --env-file /etc/gwave-web.env \
              "\$1"
          }

          start "\$IMAGE"

          ok=0
          for i in \$(seq 1 20); do
            sleep 3
            if curl -fsS http://127.0.0.1:4100/health >/dev/null; then ok=1; break; fi
          done

          if [ "\$ok" != "1" ]; then
            echo "new image failed health check"
            docker logs --tail 50 gwave-home || true
            if [ -n "\$PREV" ]; then
              echo "rolling back to \$PREV"
              start gwave-home-prev:rollback
            fi
            exit 1
          fi

          curl -fsS http://127.0.0.1:4100/health
          docker image prune -f >/dev/null 2>&1 || true
          EOF

          # ' = jq's escape for a single quote → the generated heredoc
          # marker is QUOTED so sh expands nothing inside the script.
          jq -Rs '{commands: ["bash <<\u0027GHEOF\u0027\n" + . + "GHEOF\n"]}' \
            /tmp/gh-deploy.sh > /tmp/gh-params.json
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy $ECR_REPO:${{ github.sha }}" \
            --parameters file:///tmp/gh-params.json \
            --query 'Command.CommandId' --output text)
          echo "SSM CommandId: $CMD_ID"

          STATUS=InProgress
          for i in $(seq 1 60); do
            sleep 10
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            echo "  still $STATUS (${i}0s)"
          done
          echo "----- stdout -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "----- stderr -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          echo "SSM status: $STATUS"
          [ "$STATUS" = "Success" ] || { echo "::error::gwave-home deploy failed (rolled back if a previous image existed)"; exit 1; }
