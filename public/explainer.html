<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>gWave — AI Presenter Explainer (demo)</title>
<style>
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:#06080d;color:#e7ecf5;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  .stage{position:fixed;inset:0;display:grid;place-items:center}
  .frame{position:relative;width:min(100vw,177.7vh);aspect-ratio:16/9;background:#000;overflow:hidden;border-radius:12px;box-shadow:0 20px 80px rgba(0,0,0,.6)}
  .scene{position:absolute;inset:0;opacity:0;transition:opacity 1s ease;transform:scale(1.05);animation:none}
  .scene img{width:100%;height:100%;object-fit:cover;display:block}
  .scene.on{opacity:1;animation:ken 4.2s ease forwards}
  @keyframes ken{from{transform:scale(1.02)}to{transform:scale(1.12)}}
  .cap{position:absolute;left:0;right:0;bottom:0;padding:26px 34px 30px;
    background:linear-gradient(transparent,rgba(4,6,10,.85));font-size:clamp(16px,2.6vw,30px);font-weight:800;
    opacity:0;transition:opacity .5s;text-shadow:0 2px 10px #000}
  .cap.on{opacity:1}
  .brand{position:absolute;top:18px;left:22px;font-weight:900;font-size:clamp(14px,2vw,22px);
    background:linear-gradient(135deg,#5aa9ff,#7de3c3);-webkit-background-clip:text;background-clip:text;color:transparent}
  .bar{position:absolute;left:0;bottom:0;height:4px;background:linear-gradient(90deg,#5aa9ff,#7de3c3);width:0}
  .play{position:absolute;inset:0;display:grid;place-items:center;background:rgba(4,6,10,.55);cursor:pointer;z-index:5}
  .play .btn{width:92px;height:92px;border-radius:50%;background:rgba(90,169,255,.9);display:grid;place-items:center;
    box-shadow:0 10px 40px rgba(90,169,255,.5);transition:.2s}
  .play:hover .btn{transform:scale(1.08)}
  .play .btn::after{content:"";border-style:solid;border-width:18px 0 18px 30px;border-color:transparent transparent transparent #04120d;margin-left:6px}
  .play p{position:absolute;bottom:22%;font-weight:700;color:#cdd6e6}
  .tag{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:#5a6377;font-size:12px}
  .replay{position:absolute;top:16px;right:18px;background:rgba(12,15,22,.7);border:1px solid #2a3348;color:#e7ecf5;
    border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit;display:none;z-index:6}
</style>
</head>
<body>
<div class="stage">
  <div class="frame" id="frame">
    <div class="scene" id="sc0"><img src="https://d8j0ntlcm91z4.cloudfront.net/user_3DHqwGyXRuArBB65trnU3k8oQkM/hf_20260806_013256_7120871e-8c8a-434c-8089-c7dd9b22db1f.png" alt=""></div>
    <div class="scene" id="sc1"><img src="https://d8j0ntlcm91z4.cloudfront.net/user_3DHqwGyXRuArBB65trnU3k8oQkM/hf_20260806_013311_32f6af97-3c3b-42c8-86d9-0e86e64f232c.png" alt=""></div>
    <div class="scene" id="sc2"><img src="https://d8j0ntlcm91z4.cloudfront.net/user_3DHqwGyXRuArBB65trnU3k8oQkM/hf_20260806_013314_a99be7f9-2d24-41c3-adb3-0098377c4b5c.png" alt=""></div>
    <div class="brand">gWave</div>
    <div class="cap" id="cap"></div>
    <div class="bar" id="bar"></div>
    <button class="replay" id="replay">↻ Replay</button>
    <div class="play" id="play"><div class="btn"></div><p>▶ Play the gWave explainer (with sound)</p></div>
  </div>
</div>
<div class="tag">Demo built from AI-generated presenter scenes + AI voice narration · gwave.cc</div>

<audio id="audio" src="https://d8j0ntlcm91z4.cloudfront.net/user_3DHqwGyXRuArBB65trnU3k8oQkM/hf_20260806_013153_f032c426-e1b2-4536-85f4-ef475c18a9de.wav" preload="auto"></audio>

<script>
  const scenes = [document.getElementById('sc0'),document.getElementById('sc1'),document.getElementById('sc2')];
  const caps = [
    "Welcome to gWave",
    "Scan the real world into 3D",
    "Generate objects with AI — build your own metaverse worlds & games"
  ];
  const audio = document.getElementById('audio');
  const capEl = document.getElementById('cap'), bar = document.getElementById('bar');
  const playBtn = document.getElementById('play'), replay = document.getElementById('replay');
  const DUR = 11.5;                      // narration length (s)
  const seg = DUR / scenes.length;

  function show(i){
    scenes.forEach((s,k)=>s.classList.toggle('on', k===i));
    capEl.textContent = caps[i]; capEl.classList.add('on');
    setTimeout(()=>{ if(audio.currentTime < (i+1)*seg - 0.4) capEl.classList.remove('on'); }, seg*1000-500);
  }
  let raf;
  function loop(){
    const t = audio.currentTime;
    const i = Math.min(scenes.length-1, Math.floor(t / seg));
    if(!scenes[i].classList.contains('on')) show(i);
    bar.style.width = Math.min(100, t/DUR*100) + '%';
    if(!audio.paused && !audio.ended) raf = requestAnimationFrame(loop);
  }
  function start(){
    playBtn.style.display='none'; replay.style.display='block';
    audio.currentTime=0; show(0); audio.play().catch(()=>{});
    cancelAnimationFrame(raf); loop();
  }
  playBtn.addEventListener('click', start);
  replay.addEventListener('click', start);
  audio.addEventListener('ended', ()=>{ bar.style.width='100%'; capEl.classList.add('on'); });
  // preload first frame
  scenes[0].classList.add('on');
</script>
</body>
</html>
