<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>gWave — Avatar Studio</title>
<style>
  :root{--bg:#0a0c11;--panel:#12151d;--panel2:#171b25;--line:#242a38;--text:#e9eef7;--muted:#8b93a7;--accent:#5aa9ff;--accent2:#7de3c3}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px}
  #app{display:grid;grid-template-columns:1fr 300px;height:100vh}
  main{position:relative}
  #c{width:100%;height:100%;display:block}
  .title{position:absolute;top:14px;left:16px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
  .title .dot{width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 12px var(--accent)}
  .title small{color:var(--muted);font-weight:500}
  aside{background:var(--panel);border-left:1px solid var(--line);padding:16px;overflow-y:auto}
  h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
  h3:first-child{margin-top:0}
  input,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 10px;font:inherit}
  input[type=color]{height:34px;padding:2px}
  input[type=range]{padding:0}
  label.mini{font-size:11px;color:var(--muted);display:block;margin-bottom:4px}
  .field{margin-bottom:10px}
  .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px}
  .opts button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:9px 4px;cursor:pointer;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
  .opts button .em{font-size:18px}
  .opts button.on{outline:2px solid var(--accent);background:#16223a}
  button.act{width:100%;border:0;border-radius:9px;padding:11px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),#3f7ee0);margin-top:6px}
  button.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .row{display:flex;gap:6px}.row>*{flex:1}
  #toasts{position:fixed;bottom:20px;left:20px;display:flex;flex-direction:column;gap:8px;z-index:20}
  .toast{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:9px;padding:9px 13px;font-weight:600}
</style>
</head>
<body>
<div id="app">
  <main>
    <canvas id="c"></canvas>
    <div class="title"><span class="dot"></span> gWave <small>Avatar Studio</small></div>
  </main>
  <aside>
    <div class="field"><label class="mini">Avatar name</label><input id="a-name" value="Explorer" maxlength="24"></div>

    <h3>Body</h3>
    <div class="field"><label class="mini">Height</label><input type="range" id="a-height" min="0.7" max="1.3" step="0.02" value="1"></div>
    <div class="field"><label class="mini">Body color</label><input type="color" id="a-body" value="#5aa9ff"></div>
    <div class="field"><label class="mini">Skin</label><input type="color" id="a-skin" value="#ffd9b0"></div>
    <div class="field"><label class="mini">Accent</label><input type="color" id="a-accent" value="#7de3c3"></div>

    <h3>Head</h3>
    <div class="opts" data-group="head">
      <button data-v="round"><span class="em">🙂</span>Round</button>
      <button data-v="square"><span class="em">🟦</span>Square</button>
      <button data-v="robot"><span class="em">🤖</span>Robot</button>
    </div>

    <h3>Face</h3>
    <div class="opts" data-group="face">
      <button data-v="smile"><span class="em">😊</span>Smile</button>
      <button data-v="cool"><span class="em">😎</span>Cool</button>
      <button data-v="star"><span class="em">🤩</span>Star</button>
      <button data-v="dot"><span class="em">•_•</span>Simple</button>
    </div>

    <h3>Hat</h3>
    <div class="opts" data-group="hat">
      <button data-v="none"><span class="em">🚫</span>None</button>
      <button data-v="cap"><span class="em">🧢</span>Cap</button>
      <button data-v="crown"><span class="em">👑</span>Crown</button>
      <button data-v="antenna"><span class="em">📡</span>Antenna</button>
      <button data-v="halo"><span class="em">😇</span>Halo</button>
    </div>

    <h3>Accessory</h3>
    <div class="opts" data-group="accessory">
      <button data-v="none"><span class="em">🚫</span>None</button>
      <button data-v="cape"><span class="em">🦸</span>Cape</button>
      <button data-v="backpack"><span class="em">🎒</span>Backpack</button>
      <button data-v="wings"><span class="em">🦋</span>Wings</button>
      <button data-v="tail"><span class="em">🦎</span>Tail</button>
    </div>

    <h3>Custom mesh (advanced)</h3>
    <div class="field"><label class="mini">GLB / VRM URL (overrides look)</label><input id="a-glb" placeholder="/outputs/…glb"></div>

    <h3>Save</h3>
    <button class="act" id="a-use">✅ Use this avatar</button>
    <div class="row" style="margin-top:6px">
      <button class="act ghost" id="a-random">🎲 Random</button>
      <button class="act ghost" id="a-export">⬇ Export</button>
    </div>
    <p style="color:var(--muted);font-size:11px;margin-top:8px">Saved to this browser (and your gWave account if signed in). Used in Studio, Play, Multiplayer & XR.</p>
  </aside>
</div>
<div id="toasts"></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { buildAvatar, DEFAULT_AVATAR, loadSavedAvatar } from './avatar-builder.js';

const $ = id => document.getElementById(id);
const toast = m => { const t=document.createElement('div');t.className='toast';t.textContent=m;$('toasts').appendChild(t);setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),300);},2200); };

const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.toneMapping=THREE.ACESFilmicToneMapping;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0e1420);
const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),0.05).texture;
const camera=new THREE.PerspectiveCamera(45,1,0.05,100);camera.position.set(0,1.6,4.2);
const sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(4,8,5);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun,new THREE.HemisphereLight(0xffffff,0x333844,0.8));
const floor=new THREE.Mesh(new THREE.CircleGeometry(3,48),new THREE.MeshStandardMaterial({color:0x141a28,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const ring=new THREE.Mesh(new THREE.RingGeometry(1.1,1.2,48),new THREE.MeshBasicMaterial({color:0x5aa9ff,transparent:true,opacity:0.5}));ring.rotation.x=-Math.PI/2;ring.position.y=0.01;scene.add(ring);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.target.set(0,1,0);orbit.minDistance=2;orbit.maxDistance=7;orbit.maxPolarAngle=Math.PI/1.9;
const loader=new GLTFLoader();

let cfg = loadSavedAvatar();
let avatarObj=null, spin=true;
function rebuild(){
  if(avatarObj){scene.remove(avatarObj);avatarObj=null;}
  if(cfg.glbUrl){
    loader.load(cfg.glbUrl,g=>{const n=g.scene;n.traverse(o=>{if(o.isMesh)o.castShadow=true;});
      const box=new THREE.Box3().setFromObject(n),sz=box.getSize(new THREE.Vector3());const s=1.7*cfg.height/(sz.y||1);n.scale.setScalar(s);
      const b2=new THREE.Box3().setFromObject(n);n.position.y-=b2.min.y;avatarObj=n;scene.add(n);},undefined,()=>{toast('GLB failed — using procedural');cfg.glbUrl=null;rebuild();});
  } else { avatarObj=buildAvatar(THREE,cfg); scene.add(avatarObj); }
}
rebuild();

// reflect cfg into controls
function syncUI(){
  $('a-name').value=cfg.name;$('a-height').value=cfg.height;$('a-body').value=cfg.bodyColor;$('a-skin').value=cfg.skin;$('a-accent').value=cfg.accentColor;$('a-glb').value=cfg.glbUrl||'';
  document.querySelectorAll('.opts').forEach(grp=>{const k=grp.dataset.group;grp.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===cfg[k]));});
}
syncUI();

// controls
$('a-name').oninput=e=>cfg.name=e.target.value;
$('a-height').oninput=e=>{cfg.height=+e.target.value;rebuild();};
$('a-body').oninput=e=>{cfg.bodyColor=e.target.value;rebuild();};
$('a-skin').oninput=e=>{cfg.skin=e.target.value;rebuild();};
$('a-accent').oninput=e=>{cfg.accentColor=e.target.value;rebuild();};
$('a-glb').oninput=e=>{cfg.glbUrl=e.target.value.trim()||null;rebuild();};
document.querySelectorAll('.opts').forEach(grp=>grp.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  cfg[grp.dataset.group]=b.dataset.v;grp.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');rebuild();}));

// save / use
function persist(){ try{ localStorage.setItem('gwave_avatar',JSON.stringify(cfg)); }catch{}
  // local-only for now: the Studio, engine and XR pages all read
  // localStorage.gwave_avatar. (The gwave scan-avatar system at
  // /profile/avatar stays the account-level avatar of record.)
}
$('a-use').onclick=()=>{ persist(); toast('Avatar saved ✓ — used everywhere in gWave'); };
$('a-export').onclick=()=>{ const b=new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(cfg.name||'avatar')+'.avatar.json';a.click(); };
$('a-random').onclick=()=>{
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const rc=()=>'#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0');
  cfg={...cfg,height:0.8+Math.random()*0.5,bodyColor:rc(),skin:pick(['#ffd9b0','#f1c27d','#8d5524','#e0ac69','#c68642']),accentColor:rc(),
    head:pick(['round','square','robot']),face:pick(['smile','cool','star','dot']),hat:pick(['none','cap','crown','antenna','halo']),accessory:pick(['none','cape','backpack','wings','tail']),glbUrl:null};
  syncUI();rebuild();
};

canvas.addEventListener('pointerdown',()=>spin=false);
const clock=new THREE.Clock();
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==w||canvas.height!==h){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}}
function tick(){const dt=clock.getDelta();resize();if(spin&&avatarObj)avatarObj.rotation.y+=dt*0.6;orbit.update();ring.material.opacity=0.35+Math.sin(performance.now()*0.003)*0.15;renderer.render(scene,camera);requestAnimationFrame(tick);}
tick();
</script>
</body>
</html>
